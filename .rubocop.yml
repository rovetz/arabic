AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/console'
    - 'bin/setup'
    - 'pkg/**/*'
    - 'vendor/**/*'
    - 'coverage/**/*'

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: false
